targets:
  $default:
    builders:
      drift_dev:
        options:
          # Migration araci: `dart run drift_dev make-migrations`
          # Ilk gercek APK'dan (M6) sonra her sema degisikliginde:
          #   1. database.dart'ta schemaVersion'i artir, tabloyu degistir
          #   2. dart run drift_dev make-migrations   (sema kaydi + test iskeleti)
          #   3. migration adimini yaz, test/drift altindaki testleri calistir
          databases:
            servis_defterim: lib/core/db/database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
